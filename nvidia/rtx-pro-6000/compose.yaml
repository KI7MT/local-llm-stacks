# llama.cpp server for the RTX PRO 6000 Blackwell (96 GB).
#
# One model at a time, everything on the GPU. The model and context live in .env: copy
# .env.example (gpt-oss-120b, the lab's current choice) or one of the other examples to .env.
#
# Defaults: listens on 127.0.0.1 only, and will not start without LLAMA_API_KEY.
services:
  llama:
    # llama.cpp build b11058 (2026-09-20), the build every number in docs/measured.md was taken on.
    # Pinned by digest: a tag can move under you.
    image: ghcr.io/ggml-org/llama.cpp:server-cuda-b11058@sha256:480f67114291c698d2b13097e0e3efdd57e81aa3a9de6720564c307663868a59
    container_name: llama
    restart: unless-stopped
    ports:
      - "${BIND:-127.0.0.1}:${PORT:-8080}:8080"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      # Read by llama-server from the environment, so the key never appears on a command line.
      LLAMA_API_KEY: ${LLAMA_API_KEY:?set LLAMA_API_KEY in .env}
    volumes:
      - ${MODEL_DIR:?set MODEL_DIR in .env}:/models:ro
    command: >
      --model /models/${MODEL_FILE:?set MODEL_FILE in .env}
      --host 0.0.0.0
      --port 8080
      --n-gpu-layers 999
      --ctx-size ${CTX:-131072}
      --batch-size 512
      --cache-type-k q8_0
      --cache-type-v q8_0
      --flash-attn on
      --jinja
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      # A 60+ GB model takes minutes to read from disk on first start.
      start_period: 600s
      retries: 3
